; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
lib_deps = adafruit/Adafruit INA219@^1.2.3
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:tugas1]
build_src_filter = +<tugas1.cpp> -<tugas2.cpp> -<tugas3.cpp> -<tugas4.cpp>
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit INA219@^1.2.3

[env:tugas2]
build_src_filter = +<tugas2.cpp> -<tugas1.cpp> -<tugas3.cpp> -<tugas4.cpp>
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit INA219@^1.2.3

[env:tugas3]
build_src_filter = +<tugas3.cpp> -<tugas1.cpp> -<tugas2.cpp> -<tugas4.cpp>
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit INA219@^1.2.3
